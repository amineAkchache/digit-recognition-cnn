<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digit Recognition System | CNN Model</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #1f2937, #111827);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            padding: 40px 20px 10px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
            font-weight: bold;
        }

        header p {
            margin-top: 10px;
            color: #cbd5e1;
        }

        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            text-align: center;
            margin-bottom: 40px;
        }

        canvas {
            background: black;
            border-radius: 8px;
            cursor: crosshair;
        }

        .buttons {
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            margin: 8px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .predict-btn {
            background-color: #22c55e;
            color: white;
        }

        .predict-btn:hover {
            background-color: #16a34a;
        }

        .clear-btn {
            background-color: #ef4444;
            color: white;
        }

        .clear-btn:hover {
            background-color: #dc2626;
        }

        .result-box {
            margin-top: 25px;
            padding: 15px;
            background: #0f172a;
            border-radius: 8px;
            font-size: 22px;
            font-weight: bold;
        }

        footer {
            margin-top: auto;
            padding: 20px;
            font-size: 13px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<header>
    <h1>Handwritten Digit Recognition</h1>
    <p>Powered by Convolutional Neural Network (CNN) trained on MNIST Dataset</p>
</header>

<div class="container">
    <canvas id="canvas" width="280" height="280"></canvas>

    <div class="buttons">
        <button class="predict-btn" onclick="predict()">Predict Digit</button>
        <button class="clear-btn" onclick="clearCanvas()">Clear</button>
    </div>

    <div class="result-box" id="result">
        Prediction: -
    </div>
</div>

<footer>
    Deep Learning Web Application • CNN Model • TensorFlow Backend
</footer>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

ctx.fillStyle = "black";
ctx.fillRect(0,0,canvas.width,canvas.height);

let drawing = false;

canvas.addEventListener("mousedown", () => drawing = true);
canvas.addEventListener("mouseup", () => drawing = false);
canvas.addEventListener("mouseleave", () => drawing = false);
canvas.addEventListener("mousemove", draw);

function draw(e){
    if(!drawing) return;
    ctx.fillStyle = "white";
    ctx.beginPath();
    ctx.arc(e.offsetX, e.offsetY, 10, 0, Math.PI*2);
    ctx.fill();
}

function clearCanvas(){
    ctx.fillStyle = "black";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    document.getElementById("result").innerText = "Prediction: -";
}

function predict(){
    const dataURL = canvas.toDataURL();

    fetch("/predict", {
        method: "POST",
        headers: {"Content-Type": "application/x-www-form-urlencoded"},
        body: "image=" + encodeURIComponent(dataURL)
    })
    .then(response => response.json())
    .then(data => {
        document.getElementById("result").innerText =
            "Prediction: " + data.digit + 
            " | Confidence: " + data.confidence + "%";
    });
}
</script>

</body>
</html>
